name: Ecosystem exact-candidate performance

run-name: Ecosystem capacity (${{ inputs.family }}) at ${{ inputs.candidate_sha }}

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full 40-character lowercase commit SHA containing this gate; dispatch from a ref whose head is that commit
        required: true
        type: string
      family:
        description: Family to qualify; All is the combined diagnostic campaign and never satisfies release readiness
        required: true
        type: choice
        options:
          - Documents
          - Projections
          - Workflows
          - All
      confirmation:
        description: Type RUN-ECOSYSTEM-PERFORMANCE to start the multi-hour campaign
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: bluetusk-reference-host
  cancel-in-progress: false

jobs:
  qualify:
    name: Isolated Windows ecosystem capacity campaign
    runs-on: [self-hosted, windows, x64, bluetusk-benchmark]
    timeout-minutes: 480
    env:
      EVIDENCE_ROOT: artifacts/ecosystem-performance/${{ github.run_id }}-${{ github.run_attempt }}
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      CAPACITY_FAMILY: ${{ inputs.family }}
      CONFIRMATION: ${{ inputs.confirmation }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Verify full clean candidate SHA, family scope and gate contract
        shell: pwsh
        run: |
          if ($env:CANDIDATE_SHA -cnotmatch '^[0-9a-f]{40}$') { throw 'Ecosystem capacity requires a lowercase full candidate SHA.' }
          if ($env:CONFIRMATION -cne 'RUN-ECOSYSTEM-PERFORMANCE') { throw 'The exact manual gate confirmation is required.' }
          if ($env:CAPACITY_FAMILY -cnotin @('Documents', 'Projections', 'Workflows', 'All')) { throw 'Choose Documents, Projections, Workflows or the diagnostic All campaign.' }
          if ($env:CAPACITY_FAMILY -cne 'All' -and $env:GITHUB_SHA -cne $env:CANDIDATE_SHA) {
            throw 'Family capacity runs are bound by head_sha; dispatch from a ref whose head is the candidate.'
          }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "CAPACITY_SLUG=$($env:CAPACITY_FAMILY.ToLowerInvariant())" -Encoding utf8
          ./eng/verify-ecosystem-performance.ps1 -Mode Preflight -ExpectedCommit $env:CANDIDATE_SHA -EvidenceRoot $env:EVIDENCE_ROOT -Product $env:CAPACITY_FAMILY

      - name: Start dedicated digest-pinned PostgreSQL 15 for Jobs and Workflows
        if: inputs.family == 'Workflows' || inputs.family == 'All'
        shell: pwsh
        run: |
          $name = 'bluetusk-ecosystem-pg15'
          $existing = @(docker container ls -a --format '{{.Names}}' --filter "name=^/$name$")
          if ($LASTEXITCODE -ne 0 -or $existing.Count -ne 0) { throw 'The dedicated Jobs/Workflows fixture name is already in use or Docker is unavailable.' }
          $budgets = Get-Content eng/ecosystem-performance-budgets.json -Raw | ConvertFrom-Json
          $fixturePassword = [Convert]::ToHexString([Security.Cryptography.RandomNumberGenerator]::GetBytes(24))
          docker run -d --name $name --label bluetusk.owner=ecosystem-performance --label "bluetusk.run=$env:GITHUB_RUN_ID" `
            --cpus 4 --memory 2g -p 127.0.0.1:55415:5432 `
            -e POSTGRES_USER=postgres -e "POSTGRES_PASSWORD=$fixturePassword" -e POSTGRES_DB=bluetusk_ecosystem $budgets.postgreSql15Image
          if ($LASTEXITCODE -ne 0) { throw 'Dedicated Jobs/Workflows fixture did not start.' }
          $ready = $false
          for ($attempt = 0; $attempt -lt 150; $attempt++) {
            docker exec $name pg_isready -h 127.0.0.1 -U postgres -d bluetusk_ecosystem *> $null
            if ($LASTEXITCODE -eq 0) { $ready = $true; break }
            Start-Sleep -Milliseconds 200
          }
          if (-not $ready) { throw 'Dedicated Jobs/Workflows fixture did not become ready.' }

      - name: Run the selected scope's repeated qualification campaigns
        shell: pwsh
        run: ./eng/verify-ecosystem-performance.ps1 -Mode Run -ExpectedCommit $env:CANDIDATE_SHA -EvidenceRoot $env:EVIDENCE_ROOT -Product $env:CAPACITY_FAMILY

      - name: Recheck archived evidence, exact family scope and every SHA-256 binding
        shell: pwsh
        run: ./eng/verify-ecosystem-performance.ps1 -Mode Verify -ExpectedCommit $env:CANDIDATE_SHA -EvidenceRoot $env:EVIDENCE_ROOT -Product $env:CAPACITY_FAMILY

      - name: Upload qualified family capacity evidence
        if: inputs.family != 'All'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: expansion-${{ env.CAPACITY_SLUG }}-capacity-${{ inputs.candidate_sha }}
          path: ${{ env.EVIDENCE_ROOT }}
          if-no-files-found: error
          retention-days: 90

      - name: Retain partial family diagnostics separately on failure
        if: failure() && inputs.family != 'All'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.CAPACITY_SLUG }}-capacity-partial-${{ inputs.candidate_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE_ROOT }}
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload the combined diagnostic campaign, which is never release evidence
        if: always() && inputs.family == 'All'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ecosystem-performance-${{ inputs.candidate_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE_ROOT }}
          if-no-files-found: error
          retention-days: 90

      - name: Remove only this run's Jobs and Workflows fixture
        if: always() && (inputs.family == 'Workflows' || inputs.family == 'All')
        shell: pwsh
        run: |
          $name = 'bluetusk-ecosystem-pg15'
          $existing = @(docker container ls -a --format '{{.Names}}' --filter "name=^/$name$")
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect dedicated fixture for cleanup.' }
          if ($existing.Count -eq 0) { return }
          $labels = docker inspect $name --format '{{json .Config.Labels}}' | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $labels.'bluetusk.owner' -ne 'ecosystem-performance' -or $labels.'bluetusk.run' -ne $env:GITHUB_RUN_ID) {
            throw 'Refusing to remove a fixture not owned by this workflow run.'
          }
          docker rm -f $name
          if ($LASTEXITCODE -ne 0) { throw 'Failed to remove this run’s Jobs/Workflows fixture.' }
