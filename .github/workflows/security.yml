name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 4 * * 2"
  workflow_dispatch:
    inputs:
      submit_nuget_dependencies:
        description: Restore the exact candidate and submit its NuGet dependency graph
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      packages: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify intentional test-credential boundary
        shell: pwsh
        run: ./eng/verify-test-credential-inventory.ps1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: csharp
          build-mode: manual
      - name: Restore and build
        run: |
          dotnet restore BlueTusk.slnx
          dotnet build BlueTusk.slnx --configuration Release --no-restore
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low

  verify-nuget-dependencies:
    name: Verify candidate NuGet dependencies
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.submit_nuget_dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      snapshot-id: ${{ steps.archive.outputs.artifact-id }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Stage the candidate package feed
        shell: pwsh
        run: ./eng/build-prerelease-packages.ps1
      - name: Restore and verify dependency inputs
        shell: pwsh
        run: |
          dotnet restore BlueTusk.slnx
          if ($LASTEXITCODE -ne 0) { throw 'The repository NuGet restore failed.' }
          dotnet restore applications/BlueTusk.Applications.slnx `
            --configfile eng/nuget/applications-candidate.config `
            --packages artifacts/application-nuget-cache `
            --force-evaluate `
            --no-http-cache
          if ($LASTEXITCODE -ne 0) { throw 'The application candidate restore failed.' }
          ./eng/verify-application-candidate-restore.ps1
      - name: Verify the resolved NuGet graph
        run: |
          python3 eng/build-nuget-dependency-snapshot.py \
            --commit "$GITHUB_SHA" --ref "$GITHUB_REF" --run "$GITHUB_RUN_ID" \
            --repository-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --output artifacts/nuget-dependency-snapshot.json

      - name: Archive the resolved NuGet graph
        id: archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nuget-dependency-snapshot-${{ github.run_attempt }}
          path: artifacts/nuget-dependency-snapshot.json
          if-no-files-found: error

  submit-nuget-dependencies:
    name: Submit candidate NuGet dependencies
    needs: verify-nuget-dependencies
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.submit_nuget_dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Require the verification job's artifact ID
        shell: bash
        env:
          SNAPSHOT_ID: ${{ needs.verify-nuget-dependencies.outputs.snapshot-id }}
        run: '[[ "$SNAPSHOT_ID" =~ ^[1-9][0-9]*$ ]]'

      - name: Retrieve the snapshot from this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.verify-nuget-dependencies.outputs.snapshot-id }}
          merge-multiple: true
          path: artifacts

      - name: Submit the resolved NuGet snapshot
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          snapshot=artifacts/nuget-dependency-snapshot.json
          jq -e --arg sha "$GITHUB_SHA" --arg ref "$GITHUB_REF" --arg run "$GITHUB_RUN_ID" '
            .version == 0 and .sha == $sha and .ref == $ref and
            .job.id == $run and .job.correlator == "bluetusk-nuget" and
            (.manifests | type == "object" and length > 0)
          ' "$snapshot" >/dev/null
          gh api --method POST "repos/$GITHUB_REPOSITORY/dependency-graph/snapshots" \
            --input "$snapshot"
