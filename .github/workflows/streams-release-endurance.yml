name: Streams 72-hour release endurance

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type RUN-STREAMS-72-HOUR-ENDURANCE to start the release gate
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: streams-72-hour-release-endurance
  cancel-in-progress: false

jobs:
  relay-endurance:
    name: PostgreSQL 19 relay endurance
    if: inputs.confirmation == 'RUN-STREAMS-72-HOUR-ENDURANCE'
    runs-on: [self-hosted, linux, x64, bluetusk-endurance]
    timeout-minutes: 4500

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore endurance dependencies
        run: dotnet restore tests/BlueTusk.StressTests/BlueTusk.StressTests.csproj

      - name: Start PostgreSQL 19
        run: docker compose -f eng/compose/postgres.yml --profile preview up -d --wait postgres19

      - name: Run 72-hour fault-injected relay endurance
        env:
          BLUETUSK_TEST_CONNECTION_STRING: Host=localhost;Port=5419;Username=postgres;Password=postgres;Database=bluetusk_tests;SSL Mode=Disable;Channel Binding=Disable
          BLUETUSK_RELAY_ENDURANCE_DURATION: 3.00:00:00
          BLUETUSK_RELAY_ENDURANCE_INTERVAL_MS: 250
          BLUETUSK_RELAY_ENDURANCE_MIN_TRANSACTIONS: 100000
          BLUETUSK_RELAY_ENDURANCE_REPORT: artifacts/test-results/streams-relay-endurance/report.json
        run: >-
          dotnet test tests/BlueTusk.StressTests/BlueTusk.StressTests.csproj
          --configuration Release
          --no-restore
          --filter FullyQualifiedName~StreamsRelayEnduranceTests
          --logger trx
          --results-directory artifacts/test-results/streams-relay-endurance

      - name: Upload endurance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: streams-relay-endurance-${{ github.run_id }}
          path: artifacts/test-results/streams-relay-endurance
          if-no-files-found: error
          retention-days: 90

      - name: Capture PostgreSQL logs on failure
        if: failure()
        run: docker compose -f eng/compose/postgres.yml --profile preview logs postgres19

      - name: Stop PostgreSQL 19
        if: always()
        run: docker compose -f eng/compose/postgres.yml --profile preview down --volumes
