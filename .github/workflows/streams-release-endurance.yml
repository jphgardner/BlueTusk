name: Streams 72-hour release endurance

on:
  workflow_dispatch:
    inputs:
      runner_label:
        description: One-job Kubernetes runner label created by eng/runners/invoke-kubernetes-endurance.ps1
        required: true
        type: string
      package_run_id:
        description: Successful exact-candidate 1.2 Core package build run ID
        required: true
        type: string
      confirmation:
        description: Type RUN-STREAMS-72-HOUR-ENDURANCE to start the release gate
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: streams-72-hour-release-endurance
  cancel-in-progress: false

jobs:
  relay-endurance:
    name: Stable PostgreSQL core relay endurance
    if: inputs.confirmation == 'RUN-STREAMS-72-HOUR-ENDURANCE' && startsWith(inputs.runner_label, 'bluetusk-kube-')
    runs-on: [self-hosted, linux, x64, '${{ inputs.runner_label }}']
    timeout-minutes: 4500

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Verify canonical Core package evidence for this candidate
        shell: pwsh
        env:
          GITHUB_TOKEN: '${{ github.token }}'
          PACKAGE_RUN_ID: '${{ inputs.package_run_id }}'
        run: >-
          ./eng/receive-core-package-candidate.ps1
          -BuildRunId $env:PACKAGE_RUN_ID
          -ExpectedCommit $env:GITHUB_SHA
          -EnduranceDirectory artifacts/test-results/streams-relay-endurance

      - name: Start digest-pinned PostgreSQL 18
        run: docker compose -f eng/compose/postgres.yml up -d --wait postgres18

      - name: Run 72-hour fault-injected relay endurance
        shell: pwsh
        env:
          BLUETUSK_TEST_CONNECTION_STRING: Host=localhost;Port=5418;Username=postgres;Password=postgres;Database=bluetusk_tests;SSL Mode=Disable;Channel Binding=Disable
        run: >-
          ./eng/run-streams-endurance.ps1
          -Duration '3.00:00:00'
          -MinimumTransactions 100000
          -IntervalMilliseconds 250
          -ReportPath 'artifacts/test-results/streams-relay-endurance/report.json'
          -CandidateProvenancePath 'artifacts/test-results/streams-relay-endurance/candidate-sbom/build-provenance.json'
          -PostgreSqlImage 'postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873'
          -Configuration Release

      - name: Verify endurance evidence
        shell: pwsh
        run: >-
          ./eng/verify-streams-endurance-report.ps1
          -ReleaseTrack Core
          -ReportPath 'artifacts/test-results/streams-relay-endurance/report.json'
          -RequiredDuration '3.00:00:00'
          -MinimumTransactions 100000
          -ExpectedCommit '${{ github.sha }}'
          -CandidateProvenancePath 'artifacts/test-results/streams-relay-endurance/candidate-sbom/build-provenance.json'
          -ExpectedPostgreSqlImage 'postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873'

      - name: Upload endurance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: streams-relay-endurance-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/test-results/streams-relay-endurance
          if-no-files-found: error
          retention-days: 90

      - name: Capture PostgreSQL logs on failure
        if: failure()
        run: docker compose -f eng/compose/postgres.yml logs postgres18

      - name: Stop PostgreSQL 18
        if: always()
        run: docker compose -f eng/compose/postgres.yml stop postgres18
