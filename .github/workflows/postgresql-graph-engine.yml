name: PostgreSQL graph engine

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths:
      - 'extensions/bluetusk_graph/**'
      - 'eng/run-native-graph-topology.ps1'
      - 'applications/src/ServiceTopology/**'
      - 'tests/BlueTusk.ContinuousGraph.Tests/ServiceTopologyGraphCanaryTests.cs'
      - 'src/BlueTusk.EntityFrameworkCore/Graphs/**'
      - 'eng/compatibility/**'
      - 'eng/dotnet-compatibility.json'
      - 'eng/install-dotnet-compatibility.ps1'
      - 'eng/EntityFrameworkCore.props'
      - 'Directory.*.props'
      - 'global.json'
      - 'src/BlueTusk.ContinuousGraph/**'
      - 'tests/BlueTusk.ContinuousGraph.Tests/BlueTusk.ContinuousGraph.Tests.csproj'
      - 'tests/BlueTusk.ContinuousGraph.Tests/GraphEngineIntegrationTests.cs'
      - '.github/workflows/postgresql-graph-engine.yml'

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Select the PostgreSQL and .NET runtime pairs
        id: matrix
        shell: bash
        run: |
          matrix=$(jq -c '[.frameworks[] | {major: 18, framework: .}] +
            [range(15;18) | {major: ., framework: "net10.0"}]' eng/dotnet-compatibility.json)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  graph-engine:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      GRAPH_MAJOR: ${{ matrix.major }}
      GRAPH_FRAMEWORK: ${{ matrix.framework }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install the pinned SDK and client runtime
        shell: pwsh
        run: ./eng/install-dotnet-compatibility.ps1 -Framework $env:GRAPH_FRAMEWORK -SkipAspNetRuntime
      - name: Build PGXS extension for the pinned server
        shell: bash
        run: |
          set -euo pipefail
          case "$GRAPH_MAJOR" in
            15) digest=f7d23353e1b15400d22ebe31189f4d314b87a4c129cc400c8c2d8d4ca127bf81 ;;
            16) digest=721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea ;;
            17) digest=b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24 ;;
            18) digest=77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873 ;;
            *) exit 1 ;;
          esac
          image="postgres:$GRAPH_MAJOR-alpine@sha256:$digest"
          docker build --build-arg "POSTGRES_IMAGE=$image" -t bluetusk-graph-engine extensions/bluetusk_graph
          echo "GRAPH_BASE_IMAGE=$image" >> "$GITHUB_ENV"
      - name: Validate SQL, EF and Live
        shell: bash
        run: |
          set -euo pipefail
          container=$(docker run --rm -d -e POSTGRES_HOST_AUTH_METHOD=trust \
            -e POSTGRES_DB=graph_engine -p 127.0.0.1::5432 bluetusk-graph-engine)
          trap 'docker stop "$container" >/dev/null' EXIT
          for attempt in {1..30}; do
            if docker exec "$container" pg_isready -h 127.0.0.1 -U postgres -d graph_engine; then
              break
            fi
            sleep 1
          done
          docker exec "$container" pg_isready -h 127.0.0.1 -U postgres -d graph_engine
          if [ "$GRAPH_FRAMEWORK" = net10.0 ]; then
            for test in traversal features oracle fraud-rank-refill; do
              docker exec -i "$container" psql -X -v ON_ERROR_STOP=1 -U postgres -d graph_engine \
                < "extensions/bluetusk_graph/sql/$test.sql"
            done
          fi

          contract=eng/dotnet-compatibility.json
          export DOTNET_ROOT="$PWD/artifacts/dotnet"
          export DOTNET_HOST_PATH="$DOTNET_ROOT/dotnet"
          export DOTNET_ROLL_FORWARD=LatestPatch
          export DOTNET_ROLL_FORWARD_TO_PRERELEASE=0
          export BLUETUSK_GRAPH_ENGINE_TEST_RUNTIME
          BLUETUSK_GRAPH_ENGINE_TEST_RUNTIME=$(jq -r --arg tfm "$GRAPH_FRAMEWORK" '.runtimeVersions[$tfm]' "$contract")

          suite=BlueTusk.ContinuousGraph.Tests
          project="tests/$suite/$suite.csproj"
          results=artifacts/graph-engine
          mkdir -p "$results"
          build_flags=(-c Release -f "$GRAPH_FRAMEWORK" --artifacts-path "$PWD/artifacts/graph-engine-build"
            "-p:BlueTuskRuntimeTargetFrameworks=$GRAPH_FRAMEWORK" -p:BlueTuskGraphEngineTests=true -p:CheckEolTargetFramework=false)
          filter='FullyQualifiedName~GraphEngineIntegrationTests'
          legacy_image=$(jq -r --arg tfm "$GRAPH_FRAMEWORK" '.legacyLinuxContainers[$tfm].image // empty' "$contract")
          if [ -n "$legacy_image" ]; then
            "$DOTNET_HOST_PATH" build "$project" "${build_flags[@]}"
            legacy_sdk=$(jq -r --arg tfm "$GRAPH_FRAMEWORK" '.legacyLinuxContainers[$tfm].sdkVersion' "$contract")
            output="artifacts/graph-engine-build/bin/$suite/release_$GRAPH_FRAMEWORK"
            stage=artifacts/graph-engine-client
            mkdir -p "$stage"
            cp -a "$output/." "$stage/"
            printf '%s\n' '{"runtimeOptions":{"additionalProbingPaths":[]}}' > "$stage/$suite.runtimeconfig.dev.json"
            export BLUETUSK_GRAPH_ENGINE_TEST_CONNECTION_STRING="Host=127.0.0.1;Port=5432;Database=graph_engine;Username=postgres;SSL Mode=Disable;Channel Binding=Disable"
            docker run --rm --network "container:$container" --mount "type=bind,source=$PWD,target=/repo" \
              --env DOTNET_ROLL_FORWARD --env DOTNET_ROLL_FORWARD_TO_PRERELEASE \
              --env BLUETUSK_GRAPH_ENGINE_TEST_CONNECTION_STRING --env BLUETUSK_GRAPH_ENGINE_TEST_RUNTIME \
              "$legacy_image" dotnet "/usr/share/dotnet/sdk/$legacy_sdk/vstest.console.dll" "/repo/$stage/$suite.dll" \
              "/TestCaseFilter:$filter" '/Logger:trx;LogFileName=engine.trx' "/ResultsDirectory:/repo/$results"
          else
            port=$(docker port "$container" 5432/tcp | cut -d: -f2)
            export BLUETUSK_GRAPH_ENGINE_TEST_CONNECTION_STRING="Host=127.0.0.1;Port=$port;Database=graph_engine;Username=postgres;SSL Mode=Disable;Channel Binding=Disable"
            "$DOTNET_HOST_PATH" test "$project" "${build_flags[@]}" --filter "$filter" \
              --logger 'trx;LogFileName=engine.trx' --results-directory "$results"
          fi
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          counters = ET.parse("artifacts/graph-engine/engine.trx").find(".//{*}Counters")
          assert counters is not None and counters.get("total") == counters.get("executed") == counters.get("passed") == "1"
          PY

          if [ "$GRAPH_MAJOR" = 18 ] && [ "$GRAPH_FRAMEWORK" = net10.0 ]; then
            docker exec -u postgres "$container" pg_dump -Fc -d graph_engine -f /tmp/graph-engine.dump
            docker exec -u postgres "$container" createdb graph_engine_restore
            docker exec -u postgres "$container" pg_restore --exit-on-error \
              -d graph_engine_restore /tmp/graph-engine.dump
            query="SELECT bluetusk_graph.reachable('public','oracle','v',jsonb_build_array(1,md5('1')::uuid))->>'status'"
            restored=$(docker exec -u postgres "$container" psql -X -qAt -v ON_ERROR_STOP=1 \
              -d graph_engine_restore -c "$query")
            test "$restored" = complete
            docker exec -u postgres "$container" pg_basebackup -h 127.0.0.1 \
              -D /tmp/graph-engine-standby -R -X stream -c fast
            docker exec -u postgres "$container" pg_ctl -D /tmp/graph-engine-standby \
              -l /tmp/graph-engine-standby.log -o '-p 5544' -w start
            before=$(docker exec -u postgres "$container" psql -X -qAt -v ON_ERROR_STOP=1 \
              -p 5544 -d graph_engine_restore -c "SELECT pg_is_in_recovery(), ($query)")
            test "$before" = 't|complete'
            docker exec -u postgres "$container" pg_ctl -D /tmp/graph-engine-standby -w promote
            after=$(docker exec -u postgres "$container" psql -X -qAt -v ON_ERROR_STOP=1 \
              -p 5544 -d graph_engine_restore -c "SELECT pg_is_in_recovery(), ($query)")
            test "$after" = 'f|complete'
            docker exec -u postgres "$container" pg_ctl -D /tmp/graph-engine-standby -m fast -w stop
          fi
      - name: Run the native Service Topology canary and soak
        if: matrix.major == 18 && matrix.framework == 'net10.0'
        shell: pwsh
        run: |
          $env:DOTNET_ROOT = Join-Path $PWD 'artifacts/dotnet'
          $env:DOTNET_HOST_PATH = Join-Path $env:DOTNET_ROOT 'dotnet'
          $env:DOTNET_ROLL_FORWARD = 'LatestPatch'
          ./eng/run-native-graph-topology.ps1 -Duration '00:02:00' -MinimumEvaluations 1000 -DotNetPath $env:DOTNET_HOST_PATH -OutputRoot 'artifacts/graph-engine/topology'
      - name: Package the tested native extension
        if: matrix.framework == 'net10.0'
        shell: bash
        run: |
          set -euo pipefail
          output=artifacts/graph-engine
          package="bluetusk_graph-pg$GRAPH_MAJOR-linux-amd64.tar.gz"
          docker run --rm --entrypoint sh bluetusk-graph-engine -ec '
            cd /usr/local
            tar -czf - lib/postgresql/bluetusk_graph.so \
              share/postgresql/extension/bluetusk_graph.control \
              share/postgresql/extension/bluetusk_graph--*.sql
          ' > "$output/$package"
          (
            cd "$output"
            sha256sum "$package" > "$package.sha256"
            printf 'source=%s\npostgres_image=%s\n' "$GITHUB_SHA" "$GRAPH_BASE_IMAGE" > "$package.build-info"
          )
      - name: Retain the native extension and test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bluetusk-graph-pg${{ matrix.major }}-${{ matrix.framework }}-linux-amd64-${{ github.sha }}
          path: artifacts/graph-engine
          if-no-files-found: error
