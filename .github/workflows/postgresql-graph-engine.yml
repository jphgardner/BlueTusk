name: PostgreSQL graph engine

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'extensions/bluetusk_graph/**'
      - 'src/BlueTusk.EntityFrameworkCore/Graphs/**'
      - 'src/BlueTusk.ContinuousGraph/**'
      - 'tests/BlueTusk.ContinuousGraph.Tests/BlueTusk.ContinuousGraph.Tests.csproj'
      - 'tests/BlueTusk.ContinuousGraph.Tests/GraphEngineIntegrationTests.cs'
      - '.github/workflows/postgresql-graph-engine.yml'

permissions:
  contents: read

jobs:
  graph-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - major: 15
            image: postgres:15-alpine@sha256:f7d23353e1b15400d22ebe31189f4d314b87a4c129cc400c8c2d8d4ca127bf81
          - major: 16
            image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
          - major: 17
            image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
          - major: 18
            image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
          dotnet-version: '10.0.x'
      - name: Build PGXS extension for the pinned server
        env:
          GRAPH_BASE_IMAGE: ${{ matrix.image }}
        run: docker build --build-arg "POSTGRES_IMAGE=$GRAPH_BASE_IMAGE" -t bluetusk-graph-engine extensions/bluetusk_graph
      - name: Validate SQL, EF and Live
        env:
          GRAPH_MAJOR: ${{ matrix.major }}
        shell: bash
        run: |
          set -euo pipefail
          container=$(docker run --rm -d -e POSTGRES_HOST_AUTH_METHOD=trust \
            -e POSTGRES_DB=graph_engine -p 127.0.0.1::5432 bluetusk-graph-engine)
          trap 'docker stop "$container" >/dev/null' EXIT
          for attempt in {1..30}; do
            if docker exec "$container" pg_isready -h 127.0.0.1 -U postgres -d graph_engine; then
              break
            fi
            sleep 1
          done
          docker exec -i "$container" psql -X -v ON_ERROR_STOP=1 -U postgres -d graph_engine \
            < extensions/bluetusk_graph/sql/traversal.sql
          docker exec -i "$container" psql -X -v ON_ERROR_STOP=1 -U postgres -d graph_engine \
            < extensions/bluetusk_graph/sql/oracle.sql
          docker exec -i "$container" psql -X -v ON_ERROR_STOP=1 -U postgres -d graph_engine \
            < extensions/bluetusk_graph/sql/fraud-rank-refill.sql
          port=$(docker port "$container" 5432/tcp | cut -d: -f2)
          export BLUETUSK_GRAPH_ENGINE_TEST_CONNECTION_STRING="Host=127.0.0.1;Port=$port;Database=graph_engine;Username=postgres;SSL Mode=Disable;Channel Binding=Disable"
          dotnet test tests/BlueTusk.ContinuousGraph.Tests -c Release -f net10.0 \
            -p:BlueTuskRuntimeTargetFrameworks=net10.0 -p:BlueTuskGraphEngineTests=true \
            --filter FullyQualifiedName~GraphEngineIntegrationTests \
            --logger 'trx;LogFileName=engine.trx' --results-directory artifacts/graph-engine
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          counters = ET.parse("artifacts/graph-engine/engine.trx").find(".//{*}Counters")
          assert counters is not None and counters.get("total") == counters.get("passed") == "1"
          PY

          if [ "$GRAPH_MAJOR" = 18 ]; then
            docker exec -u postgres "$container" pg_dump -Fc -d graph_engine -f /tmp/graph-engine.dump
            docker exec -u postgres "$container" createdb graph_engine_restore
            docker exec -u postgres "$container" pg_restore --exit-on-error \
              -d graph_engine_restore /tmp/graph-engine.dump
            query="SELECT bluetusk_graph.reachable('public','oracle','v',jsonb_build_array(1,md5('1')::uuid))->>'status'"
            restored=$(docker exec -u postgres "$container" psql -X -qAt -v ON_ERROR_STOP=1 \
              -d graph_engine_restore -c "$query")
            test "$restored" = complete
            docker exec -u postgres "$container" pg_basebackup -h 127.0.0.1 \
              -D /tmp/graph-engine-standby -R -X stream -c fast
            docker exec -u postgres "$container" pg_ctl -D /tmp/graph-engine-standby \
              -l /tmp/graph-engine-standby.log -o '-p 5544' -w start
            before=$(docker exec -u postgres "$container" psql -X -qAt -v ON_ERROR_STOP=1 \
              -p 5544 -d graph_engine_restore -c "SELECT pg_is_in_recovery(), ($query)")
            test "$before" = 't|complete'
            docker exec -u postgres "$container" pg_ctl -D /tmp/graph-engine-standby -w promote
            after=$(docker exec -u postgres "$container" psql -X -qAt -v ON_ERROR_STOP=1 \
              -p 5544 -d graph_engine_restore -c "SELECT pg_is_in_recovery(), ($query)")
            test "$after" = 'f|complete'
            docker exec -u postgres "$container" pg_ctl -D /tmp/graph-engine-standby -m fast -w stop
          fi
      - name: Package the tested native extension
        env:
          GRAPH_MAJOR: ${{ matrix.major }}
          GRAPH_BASE_IMAGE: ${{ matrix.image }}
        shell: bash
        run: |
          set -euo pipefail
          output=artifacts/graph-engine
          package="bluetusk_graph-pg$GRAPH_MAJOR-linux-amd64.tar.gz"
          docker run --rm --entrypoint tar bluetusk-graph-engine -C /usr/local -czf - \
            lib/postgresql/bluetusk_graph.so \
            share/postgresql/extension/bluetusk_graph.control \
            share/postgresql/extension/bluetusk_graph--1.0.sql \
            share/postgresql/extension/bluetusk_graph--1.0--1.1.sql > "$output/$package"
          (
            cd "$output"
            sha256sum "$package" > "$package.sha256"
            printf 'source=%s\npostgres_image=%s\n' "$GITHUB_SHA" "$GRAPH_BASE_IMAGE" > "$package.build-info"
          )
      - name: Retain the native extension and test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bluetusk-graph-pg${{ matrix.major }}-linux-amd64-${{ github.sha }}
          path: artifacts/graph-engine
          if-no-files-found: error
