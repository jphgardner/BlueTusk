name: V1 exact-candidate performance

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full 40-character commit SHA to benchmark
        required: true
        type: string
      confirmation:
        description: Type RUN-V1-PERFORMANCE-GATE to start the reference-machine run
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: v1-reference-performance
  cancel-in-progress: false

jobs:
  reference-performance:
    name: Windows Ryzen 7 5800X reference gate
    if: inputs.confirmation == 'RUN-V1-PERFORMANCE-GATE'
    runs-on: [self-hosted, windows, x64, bluetusk-benchmark]
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - name: Verify exact candidate and reference machine
        shell: pwsh
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          if ($env:CANDIDATE_SHA -notmatch '^[0-9a-fA-F]{40}$') {
            throw 'candidate_sha must be a full Git SHA.'
          }
          $head = (git rev-parse HEAD).Trim()
          if (-not [string]::Equals($head, $env:CANDIDATE_SHA, [StringComparison]::OrdinalIgnoreCase)) {
            throw "Checked out '$head', expected '$env:CANDIDATE_SHA'."
          }
          $processor = (Get-CimInstance Win32_Processor).Name
          if ($processor -notmatch 'AMD Ryzen 7 5800X') {
            throw "The V1 reference runner must use AMD Ryzen 7 5800X; found '$processor'."
          }

      - name: Restore and build benchmark candidate
        run: |
          dotnet restore BlueTusk.slnx
          dotnet build benchmarks/BlueTusk.Benchmarks/BlueTusk.Benchmarks.csproj --configuration Release --no-restore

      - name: Start digest-pinned PostgreSQL 19
        run: docker compose -f eng/compose/postgres.yml --profile preview up -d --wait postgres19

      - name: Run complete V1 benchmark and budget gate
        shell: pwsh
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          BLUETUSK_BENCHMARK_CONNECTION_STRING: Host=localhost;Port=5419;Database=bluetusk_tests;Username=postgres;Password=postgres;SSL Mode=Disable;Channel Binding=Disable
        run: |
          $programme = Get-Content -Raw eng/postgresql19-programme.json | ConvertFrom-Json
          $milestone = @($programme.milestones | Where-Object {
            $_.version -eq $programme.currentOfficialMilestone
          })
          if ($milestone.Count -ne 1) {
            throw 'The current PostgreSQL 19 milestone is ambiguous.'
          }
          ./eng/run-v1-performance-gate.ps1 `
            -ExpectedCommit $env:CANDIDATE_SHA `
            -PostgreSqlImage $milestone[0].image `
            -NoBuild

      - name: Upload immutable performance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v1-performance-${{ inputs.candidate_sha }}-${{ github.run_id }}
          path: artifacts/v1-performance
          if-no-files-found: error
          retention-days: 90

      - name: Capture PostgreSQL logs on failure
        if: failure()
        run: docker compose -f eng/compose/postgres.yml --profile preview logs postgres19

      - name: Stop PostgreSQL 19
        if: always()
        run: docker compose -f eng/compose/postgres.yml --profile preview down --volumes
