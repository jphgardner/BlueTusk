name: Jobs exact-candidate binary upgrade and rollback

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full 40-character candidate commit containing this gate
        required: true
        type: string
      old_sha:
        description: Full 40-character earlier Jobs preview commit reachable from the candidate
        required: true
        type: string
      confirmation:
        description: Type RUN-JOBS-RELEASE-UPGRADE for a live old/new/old format-one rehearsal
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: bluetusk-reference-host
  cancel-in-progress: false

jobs:
  qualify:
    name: Isolated Windows Jobs cross-binary rehearsal
    runs-on: [self-hosted, windows, x64, bluetusk-benchmark]
    timeout-minutes: 90
    env:
      EVIDENCE_ROOT: artifacts/jobs-release-upgrade/${{ github.run_id }}-${{ github.run_attempt }}
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      OLD_SHA: ${{ inputs.old_sha }}
      CONFIRMATION: ${{ inputs.confirmation }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Verify clean commits and manual confirmation
        shell: pwsh
        run: |
          if ($env:CANDIDATE_SHA -cnotmatch '^[0-9a-f]{40}$' -or $env:OLD_SHA -cnotmatch '^[0-9a-f]{40}$') {
            throw 'Jobs upgrade requires two lowercase full commit SHAs.'
          }
          if ($env:CONFIRMATION -cne 'RUN-JOBS-RELEASE-UPGRADE') { throw 'Exact manual Jobs upgrade confirmation is required.' }
          ./eng/verify-jobs-release-upgrade.ps1 -Mode Preflight -ExpectedCommit $env:CANDIDATE_SHA -OldCommit $env:OLD_SHA -EvidenceRoot $env:EVIDENCE_ROOT

      - name: Create disposable fixture credential
        shell: pwsh
        run: |
          $fixtureCredential = [Convert]::ToHexString([Security.Cryptography.RandomNumberGenerator]::GetBytes(24)).ToLowerInvariant()
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "JOBS_UPGRADE_FIXTURE_PASSWORD=$fixtureCredential" -Encoding utf8
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "BLUETUSK_TEST_CONNECTION_STRING=Host=127.0.0.1;Port=55417;Database=bluetusk_jobs_upgrade;Username=postgres;Password=$fixtureCredential;Pooling=false" -Encoding utf8

      - name: Start owned digest-pinned PostgreSQL 15
        shell: pwsh
        run: |
          $name = 'bluetusk-jobs-release-upgrade-pg15'
          $existing = @(docker container ls -a --format '{{.Names}}' --filter "name=^/$name$")
          if ($LASTEXITCODE -ne 0 -or $existing.Count -ne 0) { throw 'The dedicated Jobs upgrade fixture name is in use or Docker is unavailable.' }
          $budgets = Get-Content eng/jobs-release-capacity-budgets.json -Raw | ConvertFrom-Json
          docker run -d --name $name --label bluetusk.owner=jobs-release-upgrade --label "bluetusk.run=$env:GITHUB_RUN_ID" `
            --cpus 4 --memory 2g -p 127.0.0.1:55417:5432 `
            -e POSTGRES_USER=postgres -e "POSTGRES_PASSWORD=$env:JOBS_UPGRADE_FIXTURE_PASSWORD" -e POSTGRES_DB=bluetusk_jobs_upgrade $budgets.postgreSql15Image
          if ($LASTEXITCODE -ne 0) { throw 'Dedicated Jobs upgrade fixture did not start.' }
          $ready = $false
          for ($attempt = 0; $attempt -lt 150; $attempt++) {
            docker exec $name pg_isready -h 127.0.0.1 -U postgres -d bluetusk_jobs_upgrade *> $null
            if ($LASTEXITCODE -eq 0) { $ready = $true; break }
            Start-Sleep -Milliseconds 200
          }
          if (-not $ready) { throw 'Dedicated Jobs upgrade fixture did not become ready.' }

      - name: Build both immutable binaries and rehearse old/new overlap and rollback
        shell: pwsh
        run: ./eng/verify-jobs-release-upgrade.ps1 -Mode Run -ExpectedCommit $env:CANDIDATE_SHA -OldCommit $env:OLD_SHA -EvidenceRoot $env:EVIDENCE_ROOT

      - name: Recheck archived source, packages, binaries and phase evidence
        shell: pwsh
        run: ./eng/verify-jobs-release-upgrade.ps1 -Mode Verify -ExpectedCommit $env:CANDIDATE_SHA -OldCommit $env:OLD_SHA -EvidenceRoot $env:EVIDENCE_ROOT

      - name: Upload qualified Jobs upgrade evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: expansion-jobs-upgrade-${{ inputs.candidate_sha }}
          path: ${{ env.EVIDENCE_ROOT }}
          if-no-files-found: error
          retention-days: 90

      - name: Retain partial diagnostics separately on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jobs-upgrade-partial-${{ inputs.candidate_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE_ROOT }}
          if-no-files-found: ignore
          retention-days: 14

      - name: Remove only this run's Jobs fixture
        if: always()
        shell: pwsh
        run: |
          $name = 'bluetusk-jobs-release-upgrade-pg15'
          $existing = @(docker container ls -a --format '{{.Names}}' --filter "name=^/$name$")
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect the Jobs upgrade fixture for cleanup.' }
          if ($existing.Count -eq 0) { return }
          $labels = docker inspect $name --format '{{json .Config.Labels}}' | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $labels.'bluetusk.owner' -ne 'jobs-release-upgrade' -or $labels.'bluetusk.run' -ne $env:GITHUB_RUN_ID) {
            throw 'Refusing to remove a fixture not owned by this workflow run.'
          }
          docker rm -f $name
          if ($LASTEXITCODE -ne 0) { throw 'Failed to remove this run’s Jobs fixture.' }
