name: ContinuousGraph 24-hour release endurance

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type RUN-CONTINUOUS-GRAPH-24-HOUR-ENDURANCE to start the release gate
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: portable-graph-qualification
  cancel-in-progress: false

jobs:
  graph-endurance:
    name: Portable PostgreSQL ContinuousGraph endurance
    if: inputs.confirmation == 'RUN-CONTINUOUS-GRAPH-24-HOUR-ENDURANCE'
    runs-on: [self-hosted, linux, x64, bluetusk-endurance]
    timeout-minutes: 1530

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Verify the pinned portable PostgreSQL fixture
        shell: pwsh
        run: |
          ./eng/verify-release-track.ps1
          $tracks = Get-Content eng/release-tracks.json -Raw | ConvertFrom-Json
          $image = $tracks.graph.portablePostgreSqlImage
          $compose = docker compose -f eng/compose/postgres.yml config --format json | ConvertFrom-Json
          if ($compose.services.postgres18.image -cne $image) {
            throw 'The portable Graph fixture does not match the release track digest.'
          }
          "BLUETUSK_PORTABLE_GRAPH_IMAGE=$image" | Add-Content -LiteralPath $env:GITHUB_ENV

      - name: Build exact ContinuousGraph candidate, SBOM, and provenance
        shell: pwsh
        run: |
          ./eng/pack-product-family.ps1 `
            -Family ContinuousGraph `
            -Candidate `
            -Output 'artifacts/test-results/continuous-graph-endurance/candidate-packages'
          dotnet restore BlueTusk.slnx --locked-mode
          ./eng/generate-sbom.ps1 `
            -PackageDirectory 'artifacts/test-results/continuous-graph-endurance/candidate-packages' `
            -OutputDirectory 'artifacts/test-results/continuous-graph-endurance/candidate-sbom' `
            -Commit '${{ github.sha }}' `
            -NoRestore

      - name: Start PostgreSQL 18
        run: docker compose -f eng/compose/postgres.yml up -d --wait postgres18

      - name: Run 24-hour ContinuousGraph recovery endurance
        shell: pwsh
        env:
          BLUETUSK_TEST_CONNECTION_STRING: Host=localhost;Port=5418;Username=postgres;Password=postgres;Database=bluetusk_tests;SSL Mode=Disable;Channel Binding=Disable
        run: >-
          ./eng/run-continuous-graph-endurance.ps1
          -Duration '1.00:00:00'
          -MinimumEvaluations 100000
          -IntervalMilliseconds 250
          -ReportPath 'artifacts/test-results/continuous-graph-endurance/report.json'
          -CandidateProvenancePath 'artifacts/test-results/continuous-graph-endurance/candidate-sbom/build-provenance.json'
          -PostgreSqlImage $env:BLUETUSK_PORTABLE_GRAPH_IMAGE
          -Configuration Release

      - name: Verify ContinuousGraph endurance evidence
        shell: pwsh
        run: >-
          ./eng/verify-continuous-graph-endurance-report.ps1
          -ReportPath 'artifacts/test-results/continuous-graph-endurance/report.json'
          -RequiredDuration '1.00:00:00'
          -MinimumEvaluations 100000
          -ExpectedCommit '${{ github.sha }}'
          -CandidateProvenancePath 'artifacts/test-results/continuous-graph-endurance/candidate-sbom/build-provenance.json'
          -ExpectedPostgreSqlImage $env:BLUETUSK_PORTABLE_GRAPH_IMAGE

      - name: Upload ContinuousGraph endurance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: continuous-graph-endurance-${{ github.run_id }}
          path: artifacts/test-results/continuous-graph-endurance
          if-no-files-found: error
          retention-days: 90

      - name: Capture PostgreSQL logs on failure
        if: failure()
        run: docker compose -f eng/compose/postgres.yml logs postgres18

      - name: Stop PostgreSQL 18
        if: always()
        run: docker compose -f eng/compose/postgres.yml stop postgres18
