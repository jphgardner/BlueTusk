name: Historical PostgreSQL 19 preview compatibility

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type TEST-HISTORICAL-PG19-PREVIEW (not a stable release gate)
        required: true
        type: string

permissions:
  contents: read

jobs:
  historical-preview:
    if: inputs.confirmation == 'TEST-HISTORICAL-PG19-PREVIEW'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Verify historical preview fixture identity
        shell: pwsh
        run: ./eng/verify-postgresql19-programme.ps1
      - name: Restore locked dependencies
        run: dotnet restore BlueTusk.slnx --locked-mode
      - name: Start historical PostgreSQL 19 Beta 3 fixture
        run: docker compose -f eng/compose/postgres.yml --profile preview up -d --wait postgres19
      - name: Validate historical preview compatibility
        env:
          BLUETUSK_TEST_CONNECTION_STRING: Host=localhost;Port=5419;Username=postgres;Password=postgres;Database=bluetusk_tests;SSL Mode=Disable;Channel Binding=Disable
        run: dotnet test BlueTusk.slnx --configuration Release --no-restore --maxcpucount:1 --logger trx --results-directory artifacts/test-results/historical-postgres19
      - name: Retain historical preview results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: historical-postgres19-${{ github.sha }}-${{ github.run_id }}
          path: artifacts/test-results/historical-postgres19
          if-no-files-found: error
          retention-days: 90
      - name: Stop historical fixture
        if: always()
        run: docker compose -f eng/compose/postgres.yml stop postgres19
