          $head = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $head -cne $env:CANDIDATE_SHA) { throw 'Checkout differs from the requested candidate.' }
          if (@(git status --porcelain --untracked-files=normal).Count -ne 0) { throw 'Edge capacity requires a clean checkout.' }
          $processor = (Get-CimInstance Win32_Processor | Select-Object -First 1 -ExpandProperty Name)
          if ($processor -notmatch 'AMD Ryzen 7 5800X') { throw "Unexpected Edge reference processor: '$processor'." }
          python --version
          if ($LASTEXITCODE -ne 0) { throw 'Python is required for exact source capture.' }

      - name: Run two exact-candidate Edge campaigns
        shell: pwsh
        run: ./eng/run-edge-capacity.ps1 -ExpectedCommit $env:CANDIDATE_SHA -OutputDirectory $env:EVIDENCE_ROOT

      - name: Recheck archived Edge capacity evidence
        shell: pwsh
        run: ./eng/verify-edge-capacity.ps1 -ExpectedCommit $env:CANDIDATE_SHA -EvidenceDirectory $env:EVIDENCE_ROOT

      - name: Upload qualified Edge capacity evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: expansion-edge-capacity-${{ inputs.candidate_sha }}
          path: ${{ env.EVIDENCE_ROOT }}
          if-no-files-found: error
          retention-days: 90

      - name: Retain partial diagnostics separately on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: edge-capacity-partial-${{ inputs.candidate_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE_ROOT }}
          if-no-files-found: ignore
          retention-days: 14
