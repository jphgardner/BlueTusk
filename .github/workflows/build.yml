name: build

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore BlueTusk.slnx

      - name: Verify formatting
        run: dotnet format BlueTusk.slnx --no-restore --verify-no-changes

      - name: Build
        run: dotnet build BlueTusk.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test BlueTusk.slnx --configuration Release --no-build --logger trx --results-directory artifacts/test-results

      - name: Verify checked-in allocation budgets
        shell: pwsh
        run: ./eng/verify-allocation-budgets.ps1

      - name: Pack
        run: dotnet pack BlueTusk.slnx --configuration Release --no-build --output artifacts/packages

  postgresql-integration:
    name: PostgreSQL ${{ matrix.major }} live matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        major: [15, 16, 17, 18, 19]

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore BlueTusk.slnx

      - name: Start PostgreSQL
        run: docker compose -f eng/compose/postgres.yml --profile preview up -d --wait postgres${{ matrix.major }}

      - name: Run live provider matrix
        env:
          BLUETUSK_TEST_CONNECTION_STRING: Host=localhost;Port=54${{ matrix.major }};Username=postgres;Password=postgres;Database=bluetusk_tests
        run: dotnet test BlueTusk.slnx --configuration Release --no-restore --logger trx --results-directory artifacts/test-results/postgres${{ matrix.major }}

      - name: Capture PostgreSQL logs on failure
        if: failure()
        run: docker compose -f eng/compose/postgres.yml --profile preview logs postgres${{ matrix.major }}

      - name: Stop PostgreSQL
        if: always()
        run: docker compose -f eng/compose/postgres.yml --profile preview down --volumes

  replication-endurance:
    name: PostgreSQL 19 replication endurance
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore BlueTusk.slnx

      - name: Start PostgreSQL 19
        run: docker compose -f eng/compose/postgres.yml --profile preview up -d --wait postgres19

      - name: Run persistent-slot reconnect endurance
        env:
          BLUETUSK_TEST_CONNECTION_STRING: Host=localhost;Port=5419;Username=postgres;Password=postgres;Database=bluetusk_tests
          BLUETUSK_REPLICATION_DURABILITY_EPOCHS: 1000
        run: >-
          dotnet test tests/BlueTusk.IntegrationTests/BlueTusk.IntegrationTests.csproj
          --configuration Release
          --no-restore
          --filter FullyQualifiedName~Logical_replication_validates_and_resumes
          --logger trx
          --results-directory artifacts/test-results/replication-endurance

      - name: Capture PostgreSQL logs on failure
        if: failure()
        run: docker compose -f eng/compose/postgres.yml --profile preview logs postgres19

      - name: Stop PostgreSQL 19
        if: always()
        run: docker compose -f eng/compose/postgres.yml --profile preview down --volumes
