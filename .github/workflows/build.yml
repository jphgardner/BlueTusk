  gssapi-authentication:
    name: PostgreSQL 18 GSSAPI/Kerberos
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore BlueTusk.slnx

      - name: Install Kerberos client
        run: sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install --yes krb5-user

      - name: Start PostgreSQL and MIT Kerberos KDC
        run: docker compose -f eng/compose/postgres.yml --profile security-tests up -d --build --wait gss18

      - name: Acquire test Kerberos ticket
        env:
          KRB5_CONFIG: ${{ github.workspace }}/eng/compose/gssapi/krb5-client.conf
          KRB5CCNAME: FILE:${{ runner.temp }}/bluetusk-krb5cc
        run: |
          printf '%s\n' '127.0.0.1 gss18.bluetusk.test' | sudo tee -a /etc/hosts
          printf '%s\n' 'bluetusk-gss-password' | kinit bluetusk_gss_test@BLUETUSK.TEST
          for attempt in $(seq 1 10); do
            if kvno postgres/gss18.bluetusk.test@BLUETUSK.TEST; then exit 0; fi
            sleep 1
          done
          exit 1

      - name: Run GSSAPI/Kerberos acceptance
        env:
          KRB5_CONFIG: ${{ github.workspace }}/eng/compose/gssapi/krb5-client.conf
          KRB5CCNAME: FILE:${{ runner.temp }}/bluetusk-krb5cc
          KRB5_TRACE: ${{ runner.temp }}/bluetusk-krb5.trace
          BLUETUSK_GSS_TEST_CONNECTION_STRING: Host=gss18.bluetusk.test;Port=5718;Username=bluetusk_gss_test;Database=bluetusk_tests;SSL Mode=Disable;Channel Binding=Disable;Kerberos Service Name=postgres
        run: >-
          dotnet test tests/BlueTusk.IntegrationTests/BlueTusk.IntegrationTests.csproj
          --configuration Release
          --no-restore
          --filter FullyQualifiedName~GSSAPI_Kerberos
          --logger trx
          --results-directory artifacts/test-results/gss18

      - name: Capture PostgreSQL/Kerberos logs on failure
        if: failure()
        run: |
          if [[ -f "${{ runner.temp }}/bluetusk-krb5.trace" ]]; then
            cat "${{ runner.temp }}/bluetusk-krb5.trace"
          fi
          docker compose -f eng/compose/postgres.yml --profile security-tests logs gss18

      - name: Stop PostgreSQL and MIT Kerberos KDC
        if: always()
        run: docker compose -f eng/compose/postgres.yml --profile security-tests down --volumes
