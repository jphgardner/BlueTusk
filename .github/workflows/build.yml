name: Kubernetes Docker Compose runner smoke

on:
  workflow_dispatch:
    inputs:
      runner_label:
        description: Unique label for this Kubernetes runner job
        type: string
        required: true

permissions:
  contents: read

jobs:
  smoke:
    name: Verify GitHub, PowerShell and Docker Compose on Kubernetes
    runs-on: [self-hosted, linux, x64, '${{ inputs.runner_label }}']
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Verify SDK installation
        run: dotnet --version
      - name: Run the release PostgreSQL fixture
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_OS" = Linux
          test "$(id -u)" -ne 0
          test ! -e /var/run/secrets/kubernetes.io/serviceaccount/token
          test ! -S /var/run/docker.sock
          awk '$1==0 && $2!=0 { mapped=1 } END { exit !mapped }' /proc/self/uid_map
          pwsh -NoProfile -NonInteractive -Command '$PSVersionTable.PSVersion.ToString()'
          docker compose version
          compose=(docker compose --project-name "bt-probe-${GITHUB_RUN_ID}" -f eng/compose/postgres.yml)
          trap '"${compose[@]}" down --volumes' EXIT
          "${compose[@]}" up --quiet-pull -d --wait postgres18
          actual="$("${compose[@]}" exec -T postgres18 sh -ec 'psql -X -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT 1"')"
          test "$actual" = 1
          endpoint="$("${compose[@]}" port postgres18 5432 | head -n1)"
          (exec 3<>"/dev/tcp/127.0.0.1/${endpoint##*:}")
          echo 'Kubernetes runner reached the release fixture through Docker Compose.'
