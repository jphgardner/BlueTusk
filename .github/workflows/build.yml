name: Kubernetes runner smoke

on:
  workflow_dispatch:
    inputs:
      runner_label:
        description: Unique label for the smoke runner
        type: string
        required: true

permissions: {}

jobs:
  smoke:
    name: Run a Linux job on Kubernetes
    runs-on: [self-hosted, linux, x64, '${{ inputs.runner_label }}']
    timeout-minutes: 5
    steps:
      - name: Verify Kubernetes execution and workload isolation
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          test "$(id -u)" -ne 0
          test -n "$KUBERNETES_SERVICE_HOST"
          test ! -e /var/run/secrets/kubernetes.io/serviceaccount/token
          test ! -S /var/run/docker.sock
          printf 'BlueTusk runner smoke passed on %s\n' "$RUNNER_NAME"
