apiVersion: v1
kind: ServiceAccount
metadata:
  name: bluetusk-control-plane-operator
  namespace: bluetusk-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: bluetusk-control-plane-operator
rules:
  - apiGroups: [controlplane.bluetusk.io]
    resources: [bluetuskdeployments]
    verbs: [get, list, watch, patch]
  - apiGroups: [controlplane.bluetusk.io]
    resources: [bluetuskdeployments/status]
    verbs: [get, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: bluetusk-control-plane-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: bluetusk-control-plane-operator
subjects:
  - kind: ServiceAccount
    name: bluetusk-control-plane-operator
    namespace: bluetusk-system
