apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: bluetuskdeployments.controlplane.bluetusk.io
spec:
  group: controlplane.bluetusk.io
  scope: Namespaced
  names:
    plural: bluetuskdeployments
    singular: bluetuskdeployment
    kind: BlueTuskDeployment
    shortNames: [btd]
    categories: [bluetusk]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: State
          type: string
          jsonPath: .status.state
        - name: Desired
          type: integer
          jsonPath: .metadata.generation
        - name: Observed
          type: integer
          jsonPath: .status.observedGeneration
        - name: Tenant
          type: string
          jsonPath: .spec.tenantId
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [tenantId, provider, region, workloads]
              properties:
                tenantId:
                  type: string
                  minLength: 1
                  maxLength: 128
                provider:
                  type: string
                  minLength: 1
                  maxLength: 128
                region:
                  type: string
                  minLength: 1
                  maxLength: 128
                paused:
                  type: boolean
                  default: false
                deleteProtection:
                  type: boolean
                  default: true
                labels:
                  type: object
                  maxProperties: 128
                  additionalProperties:
                    type: string
                    maxLength: 4096
                workloads:
                  type: array
                  minItems: 1
                  maxItems: 32
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [kind]
                  items:
                    type: object
                    required: [kind, version, resources]
                    properties:
                      kind:
                        type: string
                        enum: [Streams, Sync, Live, ControlPlane, Dashboard, ContinuousGraph]
                      version:
                        type: string
                        minLength: 1
                        maxLength: 128
                      resources:
                        type: object
                        required: [replicas, cpuMillicoresPerReplica, memoryBytesPerReplica, storageBytes]
                        properties:
                          replicas:
                            type: integer
                            format: int32
                            minimum: 1
                            maximum: 256
                          cpuMillicoresPerReplica:
                            type: integer
                            format: int32
                            minimum: 10
                            maximum: 1000000
                          memoryBytesPerReplica:
                            type: integer
                            format: int64
                            minimum: 16777216
                            maximum: 17592186044416
                          storageBytes:
                            type: integer
                            format: int64
                            minimum: 0
                            maximum: 17592186044416
                      secretReferences:
                        type: array
                        maxItems: 128
                        x-kubernetes-list-type: map
                        x-kubernetes-list-map-keys: [store, name]
                        items:
                          type: object
                          required: [store, name]
                          properties:
                            store:
                              type: string
                              minLength: 1
                              maxLength: 128
                            name:
                              type: string
                              minLength: 1
                              maxLength: 1024
                            version:
                              type: string
                              minLength: 1
                              maxLength: 256
                      settings:
                        type: object
                        maxProperties: 256
                        additionalProperties:
                          type: string
                          maxLength: 4096
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                  minimum: 0
                managedGeneration:
                  type: integer
                  format: int64
                  minimum: 0
                state:
                  type: string
                  enum: [Pending, Planning, Applying, Ready, Degraded, Paused, Deleting, Deleted, Failed]
                diagnosticCode:
                  type: string
                  maxLength: 128
                updatedAt:
                  type: string
                  format: date-time
