---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: bluetusk-endurance
spec:
  selector:
    app.kubernetes.io/name: kafka
  ports:
    - name: broker
      port: 9092
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: bluetusk-endurance
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka
        app.kubernetes.io/part-of: bluetusk-endurance
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kafka
          image: apache/kafka:4.1.1@sha256:7240ff4534bd23dac2f215ba03a2d0aa9d041b45b830804bbdec3b81c2bdf479
          env:
            - {name: KAFKA_NODE_ID, value: "1"}
            - {name: KAFKA_PROCESS_ROLES, value: broker,controller}
            - {name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093"}
            - {name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka:9092"}
            - {name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER}
            - {name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"}
            - {name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093"}
            - {name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1"}
            - {name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: "0"}
            - {name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "false"}
          ports:
            - name: broker
              containerPort: 9092
            - name: controller
              containerPort: 9093
          readinessProbe:
            tcpSocket: {port: broker}
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 18
          resources:
            requests: {cpu: 250m, memory: 640Mi}
            limits: {cpu: "1", memory: 1280Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: bluetusk-endurance
spec:
  selector:
    app.kubernetes.io/name: minio
  ports:
    - name: api
      port: 9000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: bluetusk-endurance
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio
        app.kubernetes.io/part-of: bluetusk-endurance
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: minio
          image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:a1a8bd4ac40ad7881a245bab97323e18f971e4d4cba2c2007ec1bedd21cbaba2
          args: [server, /data]
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: endurance-runtime
                  key: s3-access-key
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: endurance-runtime
                  key: s3-secret-key
          ports:
            - name: api
              containerPort: 9000
          readinessProbe:
            httpGet: {path: /minio/health/ready, port: api}
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 750m, memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - {name: data, mountPath: /data}
      volumes:
        - name: data
          emptyDir: {sizeLimit: 4Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: opensearch
  namespace: bluetusk-endurance
spec:
  selector:
    app.kubernetes.io/name: opensearch
  ports:
    - name: http
      port: 9200
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opensearch
  namespace: bluetusk-endurance
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: opensearch
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opensearch
        app.kubernetes.io/part-of: bluetusk-endurance
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: opensearch
          image: opensearchproject/opensearch:3.7.0@sha256:44ba7ea58a319adf61c33ab16873f9ef5dbb30b291a832d375172f0b2d24e3c9
          env:
            - {name: discovery.type, value: single-node}
            - {name: DISABLE_SECURITY_PLUGIN, value: "true"}
            - {name: DISABLE_INSTALL_DEMO_CONFIG, value: "true"}
            - {name: OPENSEARCH_JAVA_OPTS, value: "-Xms768m -Xmx768m"}
          ports:
            - name: http
              containerPort: 9200
          readinessProbe:
            httpGet: {path: /, port: http}
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 30
          resources:
            requests: {cpu: 500m, memory: 1280Mi}
            limits: {cpu: "1", memory: 1792Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - {name: data, mountPath: /usr/share/opensearch/data}
      volumes:
        - name: data
          emptyDir: {sizeLimit: 4Gi}
