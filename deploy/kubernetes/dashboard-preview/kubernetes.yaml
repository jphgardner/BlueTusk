    app.kubernetes.io/name: bluetusk-dashboard-topology-collector
    app.kubernetes.io/part-of: bluetusk
subjects:
  - kind: ServiceAccount
    name: bluetusk-dashboard-topology-collector
    namespace: bluetusk-web
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: bluetusk-dashboard-topology-reader
