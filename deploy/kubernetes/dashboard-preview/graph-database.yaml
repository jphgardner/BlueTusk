apiVersion: v1
kind: ConfigMap
metadata:
  name: bluetusk-dashboard-graph-schema
  namespace: bluetusk-endurance
  labels:
    app.kubernetes.io/name: bluetusk-dashboard-graph
    app.kubernetes.io/part-of: bluetusk
    bluetusk.io/release-gate: "false"
  annotations:
    bluetusk.io/evidence-classification: non-gating-postgresql-19-beta3-public-preview
data:
  init.sql: |
    \set ON_ERROR_STOP on

    SELECT 'CREATE ROLE bluetusk_dashboard_reader LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION'
    WHERE NOT EXISTS (
      SELECT 1 FROM pg_catalog.pg_roles WHERE rolname = 'bluetusk_dashboard_reader')
    \gexec
    SELECT format(
      'ALTER ROLE bluetusk_dashboard_reader PASSWORD %L',
      :'dashboard_password')
    \gexec

    CREATE SCHEMA IF NOT EXISTS bluetusk_dashboard;
    CREATE TABLE IF NOT EXISTS bluetusk_dashboard.graph_entities (
      id text PRIMARY KEY,
      display_name text NOT NULL,
      kind text NOT NULL,
      status text NOT NULL,
      detail text NOT NULL,
      provenance text NOT NULL);
    CREATE TABLE IF NOT EXISTS bluetusk_dashboard.graph_relationships (
      id text PRIMARY KEY,
      source_id text NOT NULL REFERENCES bluetusk_dashboard.graph_entities (id),
      target_id text NOT NULL REFERENCES bluetusk_dashboard.graph_entities (id),
      kind text NOT NULL,
      weight numeric NOT NULL CHECK (weight >= 0),
      observed_at timestamptz NOT NULL,
      detail text NOT NULL);

    TRUNCATE TABLE
      bluetusk_dashboard.graph_relationships,
      bluetusk_dashboard.graph_entities;

    INSERT INTO bluetusk_dashboard.graph_entities
      (id, display_name, kind, status, detail, provenance)
    VALUES
      ('client:browser', 'Public browser', 'Client', 'external',
       'HTTPS reader of bluetusk.io and dashboard.bluetusk.io',
       'Public DNS and ingress contract'),
      ('dns:bluetusk.io', 'DigitalOcean DNS', 'DNS', 'active',
       'bluetusk.io, www.bluetusk.io, and dashboard.bluetusk.io',
       'Authoritative DigitalOcean DNS zone'),
      ('load-balancer:159.89.248.5', 'DigitalOcean load balancer', 'Load balancer', 'active',
       'One public IPv4 entry point at 159.89.248.5',
       'Kubernetes Service status'),
      ('ingress:traefik', 'Traefik ingress', 'Ingress', 'running',
       '3 replicas; one shared load balancer; HTTP to HTTPS redirect',
       'bluetusk-web Kubernetes deployment'),
      ('app:website', 'BlueTusk website', 'Application', 'running',
       '3 replicas; Angular prerender; bluetusk.io and www.bluetusk.io',
       'bluetusk-web Kubernetes deployment'),
      ('app:dashboard', 'BlueTusk dashboard', 'Application', 'running',
       '2 replicas; read-only public operations explorer',
       'bluetusk-web Kubernetes deployment'),
      ('controller:cert-manager', 'cert-manager', 'Controller', 'running',
       '2 replicas per controller; ACME certificate reconciliation',
       'cert-manager Kubernetes namespace'),
      ('certificate:bluetusk.io', 'bluetusk.io TLS certificate', 'Certificate', 'ready',
       'Let''s Encrypt production certificate for bluetusk.io and www.bluetusk.io',
       'cert-manager Certificate status'),
      ('certificate:dashboard.bluetusk.io', 'dashboard.bluetusk.io TLS certificate', 'Certificate', 'ready',
       'Let''s Encrypt production certificate for dashboard.bluetusk.io',
       'cert-manager Certificate status'),
      ('database:postgresql-19beta3', 'PostgreSQL 19 Beta 3', 'Database', 'running',
       'Digest-pinned SQL/PGQ preview with durable block storage',
       'bluetusk-endurance StatefulSet'),
      ('registry:docr', 'DigitalOcean Container Registry', 'Registry', 'active',
       'Digest-addressed website and dashboard images',
       'DigitalOcean Container Registry'),
      ('source:github', 'BlueTusk GitHub repository', 'Source', 'active',
       'Single 1.2 release candidate branch and PR #41',
       'github.com/jphgardner/BlueTusk'),
      ('release:1.2.0-rc.1', 'BlueTusk 1.2.0 RC1', 'Release', 'candidate',
       'Provider, Streams, Sync, Live, Control Plane, and Continuous Graph',
       'Exact-SHA release train'),
      ('registry:nuget', 'NuGet Gallery', 'Package registry', 'configured',
       'Trusted Publishing for BlueTusk.* packages',
       'NuGet trusted-publisher policy'),
      ('registry:npm', 'npm registry', 'Package registry', 'configured',
       'Granular-token publication for BlueTusk browser clients',
       'npm package publication policy');

    INSERT INTO bluetusk_dashboard.graph_relationships
      (id, source_id, target_id, kind, weight, observed_at, detail)
    VALUES
      ('edge:01', 'client:browser', 'dns:bluetusk.io', 'RESOLVES_WITH', 3, CURRENT_TIMESTAMP,
       'The public client resolves the BlueTusk hostnames.'),
      ('edge:02', 'dns:bluetusk.io', 'load-balancer:159.89.248.5', 'POINTS_TO', 3, CURRENT_TIMESTAMP,
       'The authoritative zone points public traffic to 159.89.248.5.'),
      ('edge:03', 'load-balancer:159.89.248.5', 'ingress:traefik', 'FORWARDS_TO', 3, CURRENT_TIMESTAMP,
       'One cloud load balancer forwards HTTP and HTTPS to Traefik.'),
      ('edge:04', 'ingress:traefik', 'app:website', 'ROUTES_TO', 3, CURRENT_TIMESTAMP,
       'Traefik routes bluetusk.io and www.bluetusk.io.'),
      ('edge:05', 'ingress:traefik', 'app:dashboard', 'ROUTES_TO', 3, CURRENT_TIMESTAMP,
       'Traefik routes dashboard.bluetusk.io.'),
      ('edge:06', 'controller:cert-manager', 'certificate:bluetusk.io', 'RECONCILES', 2, CURRENT_TIMESTAMP,
       'cert-manager renews and stores the website certificate.'),
      ('edge:07', 'controller:cert-manager', 'certificate:dashboard.bluetusk.io', 'RECONCILES', 2, CURRENT_TIMESTAMP,
       'cert-manager renews and stores the dashboard certificate.'),
      ('edge:08', 'certificate:bluetusk.io', 'app:website', 'SECURES', 3, CURRENT_TIMESTAMP,
       'The certificate terminates TLS for the website route.'),
      ('edge:09', 'certificate:dashboard.bluetusk.io', 'app:dashboard', 'SECURES', 3, CURRENT_TIMESTAMP,
       'The certificate terminates TLS for the dashboard route.'),
      ('edge:10', 'app:dashboard', 'database:postgresql-19beta3', 'EXECUTES_GRAPH_TABLE_ON', 3, CURRENT_TIMESTAMP,
       'The explorer executes the compiled release_topology GRAPH_TABLE query.'),
      ('edge:11', 'app:website', 'registry:docr', 'PULLS_IMAGE_FROM', 2, CURRENT_TIMESTAMP,
       'The website deployment uses an immutable container digest.'),
      ('edge:12', 'app:dashboard', 'registry:docr', 'PULLS_IMAGE_FROM', 2, CURRENT_TIMESTAMP,
       'The dashboard deployment uses an immutable container digest.'),
      ('edge:13', 'source:github', 'registry:docr', 'BUILDS_IMAGES_INTO', 1, CURRENT_TIMESTAMP,
       'Release automation builds and pushes immutable images.'),
      ('edge:14', 'source:github', 'release:1.2.0-rc.1', 'DEFINES', 1, CURRENT_TIMESTAMP,
       'The exact candidate commit defines the coordinated release.'),
      ('edge:15', 'release:1.2.0-rc.1', 'app:website', 'DEPLOYS', 2, CURRENT_TIMESTAMP,
       'The current candidate supplies the live website.'),
      ('edge:16', 'release:1.2.0-rc.1', 'app:dashboard', 'DEPLOYS', 2, CURRENT_TIMESTAMP,
       'The current candidate supplies the live dashboard.'),
      ('edge:17', 'release:1.2.0-rc.1', 'registry:nuget', 'PUBLISHES_TO', 1, CURRENT_TIMESTAMP,
       'NuGet packages publish only after exact release gates pass.'),
      ('edge:18', 'release:1.2.0-rc.1', 'registry:npm', 'PUBLISHES_TO', 1, CURRENT_TIMESTAMP,
       'Browser client packages publish only after exact release gates pass.');

    DROP PROPERTY GRAPH IF EXISTS bluetusk_dashboard.release_topology;
    CREATE PROPERTY GRAPH bluetusk_dashboard.release_topology
      VERTEX TABLES (
        bluetusk_dashboard.graph_entities AS entities
        KEY (id)
        LABEL component PROPERTIES (
          id AS "Id",
          display_name AS "DisplayName",
          kind AS "Kind",
          status AS "Status",
          detail AS "Detail",
          provenance AS "Provenance"))
      EDGE TABLES (
        bluetusk_dashboard.graph_relationships AS relationships
        KEY (id)
        SOURCE KEY (source_id) REFERENCES entities (id)
        DESTINATION KEY (target_id) REFERENCES entities (id)
        LABEL dependency PROPERTIES (
          id AS "Id",
          source_id AS "SourceId",
          target_id AS "TargetId",
          kind AS "Kind",
          weight AS "Weight",
          observed_at AS "ObservedAt",
          detail AS "Detail"));

    REVOKE ALL ON SCHEMA bluetusk_dashboard FROM PUBLIC;
    REVOKE ALL ON ALL TABLES IN SCHEMA bluetusk_dashboard FROM PUBLIC;
    GRANT USAGE ON SCHEMA bluetusk_dashboard TO bluetusk_dashboard_reader;
    GRANT SELECT ON ALL TABLES IN SCHEMA bluetusk_dashboard TO bluetusk_dashboard_reader;
    GRANT SELECT ON PROPERTY GRAPH bluetusk_dashboard.release_topology
      TO bluetusk_dashboard_reader;
---
apiVersion: batch/v1
kind: Job
metadata:
  name: bluetusk-dashboard-graph-init-v1
  namespace: bluetusk-endurance
  labels:
    app.kubernetes.io/name: bluetusk-dashboard-graph
    app.kubernetes.io/part-of: bluetusk
    bluetusk.io/release-gate: "false"
  annotations:
    bluetusk.io/evidence-classification: non-gating-postgresql-19-beta3-public-preview
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bluetusk-dashboard-graph-init
        app.kubernetes.io/part-of: bluetusk
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: initializer
          image: postgres:19beta3-alpine@sha256:b1692e50613a21e61c424859f943b9e193ae73e5a8c68abd5382dfb235bf15fc
          imagePullPolicy: IfNotPresent
          command: [sh, -ec]
          args:
            - |
              export PGPASSWORD="$POSTGRES_ADMIN_PASSWORD"
              psql \
                --host=postgresql \
                --username=postgres \
                --dbname=bluetusk_tests \
                --set=dashboard_password="$DASHBOARD_READER_PASSWORD" \
                --file=/config/init.sql
          env:
            - name: POSTGRES_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: endurance-runtime
                  key: postgres-password
            - name: DASHBOARD_READER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dashboard-graph-reader
                  key: password
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: schema
              mountPath: /config
              readOnly: true
      volumes:
        - name: schema
          configMap:
            name: bluetusk-dashboard-graph-schema
