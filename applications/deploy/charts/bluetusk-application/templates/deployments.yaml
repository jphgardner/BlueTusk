apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bluetusk.fullname" . }}-api
  labels: {{- include "bluetusk.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  selector: { matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: api } }
  template:
    metadata:
      labels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: api }
    spec:
      serviceAccountName: {{ include "bluetusk.fullname" . }}-api
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      topologySpreadConstraints:
        - { maxSkew: 1, topologyKey: kubernetes.io/hostname, whenUnsatisfiable: ScheduleAnyway, labelSelector: { matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: api } } }
      containers:
        - name: api
          image: {{ include "bluetusk.image" .Values.images.api }}
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8080 }]
          envFrom: [{ configMapRef: { name: {{ include "bluetusk.fullname" . }}-configuration } }]
          env:
            - { name: ConnectionStrings__Primary, valueFrom: { secretKeyRef: { name: {{ .Values.secrets.runtime }}, key: connectionString } } }
            - { name: Authentication__ClientSecret, valueFrom: { secretKeyRef: { name: {{ .Values.secrets.oidc }}, key: clientSecret } } }
            - { name: BlueTusk__Live__ResumeSigningKey, valueFrom: { secretKeyRef: { name: {{ .Values.secrets.runtime }}, key: resumeSigningKey } } }
            - { name: BlueTusk__Live__TenantConnectionStrings__pilot, valueFrom: { secretKeyRef: { name: {{ .Values.secrets.liveTenant }}, key: connectionString } } }
          readinessProbe: { httpGet: { path: /health/ready, port: http }, periodSeconds: 5, failureThreshold: 6 }
          livenessProbe: { httpGet: { path: /health/live, port: http }, periodSeconds: 10, failureThreshold: 3 }
          startupProbe: { httpGet: { path: /health/live, port: http }, periodSeconds: 3, failureThreshold: 30 }
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext: {{- include "bluetusk.podSecurity" . | nindent 12 }}
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: { sizeLimit: 64Mi } }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bluetusk.fullname" . }}-worker
  labels: {{- include "bluetusk.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.worker.replicas }}
  selector: { matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: worker } }
  template:
    metadata:
      labels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: worker }
    spec:
      serviceAccountName: {{ include "bluetusk.fullname" . }}-worker
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      topologySpreadConstraints:
        - { maxSkew: 1, topologyKey: kubernetes.io/hostname, whenUnsatisfiable: ScheduleAnyway, labelSelector: { matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: worker } } }
      containers:
        - name: worker
          image: {{ include "bluetusk.image" .Values.images.worker }}
          imagePullPolicy: IfNotPresent
          envFrom: [{ configMapRef: { name: {{ include "bluetusk.fullname" . }}-configuration } }]
          env:
            - { name: ConnectionStrings__Primary, valueFrom: { secretKeyRef: { name: {{ .Values.secrets.runtime }}, key: connectionString } } }
          resources: {{- toYaml .Values.worker.resources | nindent 12 }}
          securityContext: {{- include "bluetusk.podSecurity" . | nindent 12 }}
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: { sizeLimit: 128Mi } }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bluetusk.fullname" . }}-ui
  labels: {{- include "bluetusk.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.ui.replicas }}
  selector: { matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: ui } }
  template:
    metadata:
      labels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: ui }
    spec:
      serviceAccountName: {{ include "bluetusk.fullname" . }}-ui
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      topologySpreadConstraints:
        - { maxSkew: 1, topologyKey: kubernetes.io/hostname, whenUnsatisfiable: ScheduleAnyway, labelSelector: { matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: ui } } }
      containers:
        - name: ui
          image: {{ include "bluetusk.image" .Values.images.ui }}
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /health/live, port: http }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /health/live, port: http }, periodSeconds: 10 }
          resources: {{- toYaml .Values.ui.resources | nindent 12 }}
          securityContext: {{- include "bluetusk.podSecurity" . | nindent 12 }}
          volumeMounts:
            - { name: cache, mountPath: /var/cache/nginx }
            - { name: run, mountPath: /var/run }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: cache, emptyDir: { sizeLimit: 32Mi } }
        - { name: run, emptyDir: { sizeLimit: 4Mi } }
        - { name: tmp, emptyDir: { sizeLimit: 16Mi } }
