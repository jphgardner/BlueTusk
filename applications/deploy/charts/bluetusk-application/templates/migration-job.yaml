apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "bluetusk.fullname" . }}-migration-{{ .Release.Revision }}
  labels:
    {{- include "bluetusk.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: migration }
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "bluetusk.fullname" . }}-migration
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: migration
          image: {{ include "bluetusk.image" .Values.images.api }}
          imagePullPolicy: IfNotPresent
          args: ["--migrate"]
          envFrom: [{ configMapRef: { name: {{ include "bluetusk.fullname" . }}-configuration } }]
          env:
            - { name: ConnectionStrings__Primary, valueFrom: { secretKeyRef: { name: {{ .Values.secrets.runtime }}, key: migrationConnectionString } } }
            - { name: Authentication__ClientSecret, value: migration-not-used }
            - { name: BlueTusk__Live__ResumeSigningKey, valueFrom: { secretKeyRef: { name: {{ .Values.secrets.runtime }}, key: resumeSigningKey } } }
            - { name: BlueTusk__Live__TenantConnectionStrings__pilot, valueFrom: { secretKeyRef: { name: {{ .Values.secrets.liveTenant }}, key: connectionString } } }
          resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: 1000m, memory: 512Mi } }
          securityContext:
            {{- include "bluetusk.podSecurity" . | nindent 12 }}
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: { sizeLimit: 64Mi } }]
