{{- range $component := list "api" "worker" "ui" }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "bluetusk.fullname" $ }}-{{ $component }}
spec:
  maxUnavailable: 1
  selector: { matchLabels: { app.kubernetes.io/instance: {{ $.Release.Name }}, app.kubernetes.io/component: {{ $component }} } }
---
{{- end }}
{{- if .Values.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "bluetusk.fullname" . }}-api
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: {{ include "bluetusk.fullname" . }}-api }
  minReplicas: {{ .Values.autoscaling.minimumReplicas }}
  maxReplicas: {{ .Values.autoscaling.maximumReplicas }}
  behavior:
    scaleDown: { stabilizationWindowSeconds: 300 }
    scaleUp: { stabilizationWindowSeconds: 30 }
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: {{ .Values.autoscaling.targetCpuUtilization }} }
{{- end }}
