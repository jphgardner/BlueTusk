apiVersion: v1
kind: Service
metadata:
  name: {{ include "bluetusk.fullname" . }}-api
  labels:
    {{- include "bluetusk.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: api }
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "bluetusk.fullname" . }}-ui
  labels:
    {{- include "bluetusk.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: ui }
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "bluetusk.fullname" . }}
  labels:
    {{- include "bluetusk.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
      sectionName: {{ .Values.gateway.sectionName }}
  hostnames: [{{ .Values.hostname | quote }}]
  rules:
    - matches: [{ path: { type: PathPrefix, value: /api } }]
      backendRefs: [{ name: {{ include "bluetusk.fullname" . }}-api, port: 80 }]
    - matches: [{ path: { type: PathPrefix, value: /health } }]
      backendRefs: [{ name: {{ include "bluetusk.fullname" . }}-api, port: 80 }]
    - matches: [{ path: { type: PathPrefix, value: / } }]
      backendRefs: [{ name: {{ include "bluetusk.fullname" . }}-ui, port: 80 }]
