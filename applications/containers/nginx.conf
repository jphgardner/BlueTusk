server {
    listen 8080;
    server_name _;
    server_tokens off;
    add_header_inherit merge;
    root /usr/share/nginx/html;
    index index.html;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'" always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Resource-Policy same-origin always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-Permitted-Cross-Domain-Policies none always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /health/live {
        access_log off;
        add_header Cache-Control "no-store" always;
        return 200 'ok';
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files /index.html =404;
    }

    location ~* "-[a-z0-9_-]{8,}\.(?:css|ico|js|png|svg|woff2)$" {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / { try_files $uri $uri/ /index.html; }
}
