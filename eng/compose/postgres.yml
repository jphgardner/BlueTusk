name: bluetusk-tests

x-postgres-common: &postgres-common
  command:
    - postgres
    - -c
    - wal_level=logical
    - -c
    - max_wal_senders=10
    - -c
    - max_replication_slots=10
    - -c
    - max_prepared_transactions=10
    - -c
    - logical_decoding_work_mem=64kB
    - -c
    - hba_file=/etc/postgresql/bluetusk-pg_hba.conf
  environment:
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    POSTGRES_DB: bluetusk_tests
  volumes:
    - ./pg_hba.conf:/etc/postgresql/bluetusk-pg_hba.conf:ro
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U postgres -d bluetusk_tests"]
    interval: 2s
    timeout: 5s
    retries: 20
  restart: "no"

services:
  postgres15:
    <<: *postgres-common
    image: postgres:15-alpine
    ports: ["5415:5432"]

  postgres16:
    <<: *postgres-common
    image: postgres:16-alpine
    ports: ["5416:5432"]

  postgres17:
    <<: *postgres-common
    image: postgres:17-alpine
    ports: ["5417:5432"]

  postgres18:
    <<: *postgres-common
    image: postgres:18-alpine
    ports: ["5418:5432"]

  oauth18:
    <<: *postgres-common
    image: bluetusk/postgres-oauth-test:18
    build:
      context: ./oauth
    profiles: ["security-tests"]
    command:
      - postgres
      - -c
      - hba_file=/etc/postgresql/bluetusk-pg_hba.conf
      - -c
      - oauth_validator_libraries=bluetusk_oauth_validator
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/var/lib/postgresql/server.crt
      - -c
      - ssl_key_file=/var/lib/postgresql/server.key
    volumes:
      - ./oauth/pg_hba.conf:/etc/postgresql/bluetusk-pg_hba.conf:ro
      - ./oauth/init.sql:/docker-entrypoint-initdb.d/bluetusk-oauth.sql:ro
    ports: ["5618:5432"]

  gss18:
    <<: *postgres-common
    image: bluetusk/postgres-gss-test:18
    build:
      context: ./gssapi
    profiles: ["security-tests"]
    command:
      - postgres
      - -c
      - hba_file=/etc/postgresql/bluetusk-pg_hba.conf
      - -c
      - krb_server_keyfile=/var/lib/postgresql/postgres.keytab
    volumes:
      - ./gssapi/pg_hba.conf:/etc/postgresql/bluetusk-pg_hba.conf:ro
      - ./gssapi/init.sql:/docker-entrypoint-initdb.d/bluetusk-gss.sql:ro
    ports:
      - "5688:88/tcp"
      - "5688:88/udp"
      - "5718:5432"

  postgres19:
    <<: *postgres-common
    image: postgres:19beta2-alpine
    profiles: ["preview"]
    ports: ["5419:5432"]

  pgvector18:
    <<: *postgres-common
    image: pgvector/pgvector:pg18-trixie
    profiles: ["extension-tests"]
    ports: ["5518:5432"]

  postgis18:
    <<: *postgres-common
    image: postgis/postgis:18-3.6
    profiles: ["extension-tests"]
    ports: ["5519:5432"]

  timescaledb17:
    <<: *postgres-common
    image: timescale/timescaledb:latest-pg17
    profiles: ["extension-tests"]
    ports: ["5520:5432"]

  pgbouncer-session18:
    image: bluetusk/pgbouncer-test:1.24.0
    build:
      context: ./pgbouncer
    profiles: ["compatibility-tests"]
    depends_on:
      postgres18:
        condition: service_healthy
    ports: ["5818:6432"]
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 6432"]
      interval: 2s
      timeout: 5s
      retries: 20
    restart: "no"

  pgbouncer-transaction18:
    image: bluetusk/pgbouncer-test:1.24.0
    build:
      context: ./pgbouncer
    command: ["/etc/pgbouncer/transaction.ini"]
    profiles: ["compatibility-tests"]
    depends_on:
      postgres18:
        condition: service_healthy
    ports: ["5819:6432"]
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 6432"]
      interval: 2s
      timeout: 5s
      retries: 20
    restart: "no"

  locale-en18:
    <<: *postgres-common
    image: bluetusk/postgres-locale-test:18
    build:
      context: ./locale
    profiles: ["compatibility-tests"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bluetusk_tests
      POSTGRES_INITDB_ARGS: --locale=en_GB.UTF-8 --encoding=UTF8
    command:
      - postgres
      - -c
      - timezone=Europe/London
      - -c
      - hba_file=/etc/postgresql/bluetusk-pg_hba.conf
    ports: ["5820:5432"]

  locale-de18:
    <<: *postgres-common
    image: bluetusk/postgres-locale-test:18
    build:
      context: ./locale
    profiles: ["compatibility-tests"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bluetusk_tests
      POSTGRES_INITDB_ARGS: --locale=de_DE.UTF-8 --encoding=UTF8
    command:
      - postgres
      - -c
      - timezone=America/New_York
      - -c
      - hba_file=/etc/postgresql/bluetusk-pg_hba.conf
    ports: ["5821:5432"]

  topology-primary18:
    <<: *postgres-common
    image: postgres:18-alpine
    profiles: ["topology-tests"]
    ports: ["5830:5432"]

  topology-standby18:
    image: bluetusk/postgres-standby-test:18
    build:
      context: ./standby
    profiles: ["topology-tests"]
    environment:
      PGDATA: /var/lib/postgresql/data
    volumes:
      - ./pg_hba.conf:/etc/postgresql/bluetusk-pg_hba.conf:ro
    depends_on:
      topology-primary18:
        condition: service_healthy
    ports: ["5831:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bluetusk_tests"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: "no"

  postgres19-nightly:
    <<: *postgres-common
    image: bluetusk/postgres-nightly-test:19
    build:
      context: ./nightly
    profiles: ["nightly-tests"]
    ports: ["5899:5432"]
