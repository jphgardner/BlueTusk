name: bluetusk-tests

x-postgres-common: &postgres-common
  command:
    - postgres
    - -c
    - wal_level=logical
    - -c
    - max_wal_senders=10
    - -c
    - max_replication_slots=10
    - -c
    - max_prepared_transactions=10
    - -c
    - logical_decoding_work_mem=64kB
    - -c
    - hba_file=/etc/postgresql/bluetusk-pg_hba.conf
  environment:
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    POSTGRES_DB: bluetusk_tests
  volumes:
    - ./pg_hba.conf:/etc/postgresql/bluetusk-pg_hba.conf:ro
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U postgres -d bluetusk_tests"]
    interval: 2s
    timeout: 5s
    retries: 20
  restart: "no"

services:
  postgres15:
    <<: *postgres-common
    image: postgres:15-alpine@sha256:f7d23353e1b15400d22ebe31189f4d314b87a4c129cc400c8c2d8d4ca127bf81
    ports: ["5415:5432"]

  postgres16:
    <<: *postgres-common
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    ports: ["5416:5432"]

  postgres17:
    <<: *postgres-common
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    ports: ["5417:5432"]

  postgres18:
    <<: *postgres-common
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    ports: ["5418:5432"]

  oauth18:
    <<: *postgres-common
    image: bluetusk/postgres-oauth-test:18
    build:
      context: ./oauth
    profiles: ["security-tests"]
    command:
      - postgres
      - -c
      - hba_file=/etc/postgresql/bluetusk-pg_hba.conf
      - -c
      - oauth_validator_libraries=bluetusk_oauth_validator
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/var/lib/postgresql/server.crt
      - -c
      - ssl_key_file=/var/lib/postgresql/server.key
    volumes:
      - ./oauth/pg_hba.conf:/etc/postgresql/bluetusk-pg_hba.conf:ro
      - ./oauth/init.sql:/docker-entrypoint-initdb.d/bluetusk-oauth.sql:ro
    ports: ["5618:5432"]

  gss18:
    <<: *postgres-common
    image: bluetusk/postgres-gss-test:18
    build:
      context: ./gssapi
    profiles: ["security-tests"]
    command:
      - postgres
      - -c
      - hba_file=/etc/postgresql/bluetusk-pg_hba.conf
      - -c
      - krb_server_keyfile=/var/lib/postgresql/postgres.keytab
    volumes:
      - ./gssapi/pg_hba.conf:/etc/postgresql/bluetusk-pg_hba.conf:ro
      - ./gssapi/init.sql:/docker-entrypoint-initdb.d/bluetusk-gss.sql:ro
    ports:
      - "5688:88/tcp"
      - "5688:88/udp"
      - "5718:5432"

  postgres19:
    <<: *postgres-common
    image: postgres:19beta3-alpine@sha256:b1692e50613a21e61c424859f943b9e193ae73e5a8c68abd5382dfb235bf15fc
    profiles: ["preview"]
    ports: ["5419:5432"]

  pgvector18:
    <<: *postgres-common
    image: pgvector/pgvector:pg18-trixie
    profiles: ["extension-tests"]
    ports: ["5518:5432"]

  postgis18:
    <<: *postgres-common
    image: postgis/postgis:18-3.6
    profiles: ["extension-tests"]
    ports: ["5519:5432"]

  timescaledb17:
    <<: *postgres-common
    image: timescale/timescaledb:latest-pg17
    profiles: ["extension-tests"]
    ports: ["5520:5432"]

  pgdurable17:
    image: ghcr.io/microsoft/pg_durable:0.2.5-pg17@sha256:a674e2725d4138fd0e7bc86e0c7069b74f8f07fab397bfb18d77f8c1bc2256db
    profiles: ["extension-tests"]
    environment:
      POSTGRES_PASSWORD: postgres
    ports: ["5521:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: "no"

  pgbouncer-session18:
    image: bluetusk/pgbouncer-test:1.24.0
    build:
      context: ./pgbouncer
    profiles: ["compatibility-tests"]
    depends_on:
      postgres18:
        condition: service_healthy
    ports: ["5818:6432"]
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 6432"]
      interval: 2s
      timeout: 5s
      retries: 20
    restart: "no"

  pgbouncer-transaction18:
    image: bluetusk/pgbouncer-test:1.24.0
    build:
      context: ./pgbouncer
    command: ["/etc/pgbouncer/transaction.ini"]
    profiles: ["compatibility-tests"]
    depends_on:
      postgres18:
        condition: service_healthy
    ports: ["5819:6432"]
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 6432"]
      interval: 2s
      timeout: 5s
      retries: 20
    restart: "no"

  locale-en18:
    <<: *postgres-common
    image: bluetusk/postgres-locale-test:18
    build:
      context: ./locale
    profiles: ["compatibility-tests"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bluetusk_tests
      POSTGRES_INITDB_ARGS: --locale=en_GB.UTF-8 --encoding=UTF8
    command:
      - postgres
      - -c
      - timezone=Europe/London
      - -c
      - hba_file=/etc/postgresql/bluetusk-pg_hba.conf
    ports: ["5820:5432"]

  locale-de18:
    <<: *postgres-common
    image: bluetusk/postgres-locale-test:18
    build:
      context: ./locale
    profiles: ["compatibility-tests"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bluetusk_tests
      POSTGRES_INITDB_ARGS: --locale=de_DE.UTF-8 --encoding=UTF8
    command:
      - postgres
      - -c
      - timezone=America/New_York
      - -c
      - hba_file=/etc/postgresql/bluetusk-pg_hba.conf
    ports: ["5821:5432"]

  topology-primary18:
    <<: *postgres-common
    image: postgres:18-alpine
    profiles: ["topology-tests"]
    ports: ["5830:5432"]

  topology-standby18:
    image: bluetusk/postgres-standby-test:18
    build:
      context: ./standby
    profiles: ["topology-tests"]
    environment:
      PGDATA: /var/lib/postgresql/data
    volumes:
      - ./pg_hba.conf:/etc/postgresql/bluetusk-pg_hba.conf:ro
    depends_on:
      topology-primary18:
        condition: service_healthy
    ports: ["5831:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bluetusk_tests"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: "no"

  postgres19-nightly:
    <<: *postgres-common
    image: bluetusk/postgres-nightly-test:19
    build:
      context: ./nightly
    profiles: ["nightly-tests"]
    ports: ["5899:5432"]
