[databases]
bluetusk_tests = host=postgres18 port=5432 dbname=bluetusk_tests user=postgres password=postgres

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir =
auth_type = plain
auth_file = /etc/pgbouncer/userlist.txt
admin_users = postgres
pool_mode = session
default_pool_size = 5
max_client_conn = 100
server_reset_query = DISCARD ALL
log_connections = 0
log_disconnections = 0
pidfile = /tmp/pgbouncer.pid
