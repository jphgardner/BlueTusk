apiVersion: v1
kind: Namespace
metadata:
  name: bluetusk-runner-cache
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cache-does-not-use-the-network
  namespace: bluetusk-runner-cache
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress: []
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: bluetusk-runner-cache
  namespace: bluetusk-runner-cache
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: bluetusk-runner-cache
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bluetusk-runner-cache
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/os: linux
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: runner-image
          image: ghcr.io/actions/actions-runner@sha256:4037925f16bd0626196684aff1853dabd242675c82efe08f0a2d376694738d19
          command: [/bin/sh, -ec, 'true']
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
        - name: docker-image
          image: docker@sha256:9d337aaf171682751be04d67c15d880d6a95c6fd44cb8e12043f605012e5e654
          command: [/bin/sh, -ec, 'true']
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
        - name: powershell-image
          image: mcr.microsoft.com/powershell@sha256:73c08403182e3cd1a62176b6723645b2d2037cda8deefc0e2c2c01cb814abe43
          command: [/bin/sh, -ec, 'true']
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
      containers:
        - name: ready
          image: registry.k8s.io/pause@sha256:e5b941ef8f71de54dc3a13398226c269ba217d06650a21bd3afcf9d890cf1f41
          resources:
            requests: {cpu: '5m', memory: '8Mi'}
            limits: {cpu: '25m', memory: '16Mi'}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
