apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: bluetusk-io-v2
  namespace: bluetusk-web
  labels:
    app.kubernetes.io/name: bluetusk-website
    app.kubernetes.io/part-of: bluetusk
spec:
  secretName: bluetusk-io-tls-v2
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt-production
  dnsNames:
    - bluetusk.io
    - www.bluetusk.io
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  usages:
    - digital signature
    - key encipherment
    - server auth
  duration: 2160h
  renewBefore: 720h
